name: PR Labeler

# pull_request_target (not pull_request) so a fork's PR still gets labeled:
# it runs with the base repo's token/permissions instead of the fork's. No
# checkout step is used, so no fork code ever executes here - the action
# only calls the GitHub API (PR title/changed files) to decide labels.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  autolabel:
    runs-on: ubuntu-latest
    steps:
      # release-drafter v7's autolabeler is its own action: it only applies labels and has
      # no release-drafting code path at all (v7 removed v6's `disable-releaser`; the main
      # release-drafter action would draft a release). Versions are resolved by
      # .github/scripts/resolve_version.py from these labels.
      - name: Autolabel from title/files (release-drafter.yml rules)
        uses: release-drafter/release-drafter/autolabeler@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          config-name: release-drafter.yml
