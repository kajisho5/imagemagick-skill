name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ubuntu-no-magick-binary:
    # No ImageMagick at all (neither `magick` nor IM6's `convert`): doctor's
    # no-backend reporting, and every test that isn't gated on a backend.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/_contract.py doctor --json
      - run: python3 scripts/_contract.py contract --json
      - name: docs/contract.md matches the contract
        run: python3 .github/scripts/contract_md.py --check

  ubuntu-with-imagemagick:
    # apt's ImageMagick 6 has convert/identify/compare/montage but no `magick`
    # command. The skill uses it as it is (no shim), exactly as a user's Ubuntu
    # would. Python 3.9 is the oldest version the skill supports.
    # Pinned: Ubuntu 26.04's apt package is ImageMagick 7 (with `magick`).
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          # HEIC codecs are separate libheif plugins: x265 encodes, libde265 decodes. With
          # only the encoder, IM6 writes a HEIC it cannot read back ("Unsupported codec").
          # heif-enc builds a real HEIC with EXIF for test_gps_detection, since IM6 does
          # not parse a HEIC's EXIF on its own.
          sudo apt-get install -y libheif-examples libheif-plugin-x265 libheif-plugin-libde265
      - name: ImageMagick 6 with no magick command
        run: |
          ! command -v magick
          convert -version
      - run: python3 -m unittest discover -s tests -v
      - name: doctor finds ImageMagick 6 directly
        run: |
          python3 scripts/_contract.py doctor --json | tee doctor.json
          python3 -c "import json; d = json.load(open('doctor.json')); assert d['ok'] and d['backends']['magick']['kind'] == 'imagemagick6', d['backends']"

  macos-sips:
    # macOS ships sips out of the box - this is the only job that actually
    # exercises the sips-only fallback code paths (resize fit box math,
    # convert, probe) for real, including the fit-mode integration test that
    # is always skipped everywhere else.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/_contract.py doctor --json

  macos-imagemagick7:
    # The only job with ImageMagick 7's `magick` (Homebrew): IM7-specific output
    # formats and behaviour are checked here.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install ImageMagick 7
        run: |
          brew install imagemagick || brew upgrade imagemagick || true
          magick -version
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/_contract.py doctor --json

  windows-imagemagick7:
    # RM-051. ImageMagick 7's `magick.exe` from Chocolatey (the official installer,
    # repackaged), the way a Windows user installs it. `convert.exe` on this PATH is
    # Windows' disk-conversion tool, so the skill must find `magick` and nothing else.
    # Git Bash runs the same commands as the other jobs; `python` is setup-python's.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install ImageMagick 7
        shell: pwsh
        run: |
          choco install imagemagick -y --no-progress
          $dir = Get-ChildItem 'C:\Program Files' -Directory -Filter 'ImageMagick-7*' | Select-Object -First 1
          if (-not $dir) { throw "no C:\Program Files\ImageMagick-7* directory after choco install" }
          $dir.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: magick is ImageMagick 7
        run: |
          magick -version
          magick -version | head -n 1 | grep -q '^Version: ImageMagick 7\.'
      - run: python -m unittest discover -s tests -v
      - name: doctor finds ImageMagick 7's magick
        run: |
          python scripts/_contract.py doctor --json | tee doctor.json
          python -c "import json; d = json.load(open('doctor.json')); assert d['ok'] and d['backends']['magick']['kind'] == 'magick', d['backends']"
      - run: python scripts/_contract.py contract --json > /dev/null

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: node -c bin/install.js
      - name: Exercise every install target in a throwaway HOME
        run: |
          set -e
          export HOME="$RUNNER_TEMP/fake-home"
          mkdir -p "$HOME"
          node bin/install.js
          test -f "$HOME/.claude/skills/imagemagick-skill/SKILL.md"
          node bin/install.js --cursor
          test -f "$HOME/.cursor/skills/imagemagick-skill/SKILL.md"
          node bin/install.js --codex
          test -f "$HOME/.agents/skills/imagemagick-skill/SKILL.md"
          node bin/install.js --uninstall
          test ! -d "$HOME/.claude/skills/imagemagick-skill"
          node bin/install.js doctor --json
          node bin/install.js contract --json
      - name: Install from the packed tarball through npx, as a user would
        run: |
          set -e
          npm pack --pack-destination "$RUNNER_TEMP"
          TARBALL=$(ls "$RUNNER_TEMP"/imagemagick-skill-*.tgz)
          export HOME="$RUNNER_TEMP/npx-home"
          mkdir -p "$HOME"
          cd "$RUNNER_TEMP"
          npx --yes --package "$TARBALL" imagemagick-skill
          test -f "$HOME/.claude/skills/imagemagick-skill/scripts/_contract.py"
          npx --yes --package "$TARBALL" imagemagick-skill doctor --json
          python3 "$HOME/.claude/skills/imagemagick-skill/mcp/server.py" --list
          npx --yes --package "$TARBALL" imagemagick-skill --uninstall
          test ! -d "$HOME/.claude/skills/imagemagick-skill"
